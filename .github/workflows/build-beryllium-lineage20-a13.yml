name: Build Xiaomi POCO F1 (LineageOS 20 / Android 13) (Kernel 4.9)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "beryllium"
  DEVICE_CODENAME : "beryllium"

  CUSTOM_CMDS : ""
  EXTRA_CMDS : "KCFLAGS=-Wno-error"

  KERNEL_SOURCE : "https://github.com/IniGwYaN/android_kernel_xiaomi_sdm845.git"
  KERNEL_BRANCH : "lineage-20"

  CLANG_SOURCE : ""
  CLANG_BRANCH : ""

  GCC_GNU : true
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-gnu-4.9.git"
  GCC_64_BRANCH : "android-4.9"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-gnueabihf-4.9.git"
  GCC_32_BRANCH : "android-4.9"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/xiaomi/mi845_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "bakasu"

  SUSFS_ENABLE : true
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "lineage20_a13"

  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "true"

  BUILD_OTHER_CONFIG: "true"
  MERGE_CONFIG_FILES: "vendor/xiaomi/beryllium.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: POCO F1 beryllium (LineageOS 20, kernel 4.9)
    runs-on: ubuntu-24.04
    container: ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🛠️ Install sudo
        run: |
          apt-get update
          apt-get install -y sudo

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options (perf/adem/ram)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          KCFG=arch/arm64/configs/vendor/xiaomi/beryllium.config
          add() { grep -qxF "$1" "$KCFG" || echo "$1" >> "$KCFG"; }
          add 'CONFIG_CPU_FREQ_GOV_INTERACTIVE=y'
          add 'CONFIG_MSM_PERFORMANCE=y'
          add 'CONFIG_CPU_BOOST=y'
          add 'CONFIG_IOSCHED_BFQ=y'
          add 'CONFIG_DEFAULT_IOSCHED="bfq"'
          add 'CONFIG_TCP_CONG_WESTWOOD=y'
          add 'CONFIG_DEFAULT_TCP_CONG="westwood"'
          add 'CONFIG_SCHED_AUTOGROUP=y'
          add 'CONFIG_ZRAM=y'
          add 'CONFIG_ZSMALLOC=y'
          add 'CONFIG_SWAP=y'
          add 'CONFIG_CLEANCACHE=y'

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
